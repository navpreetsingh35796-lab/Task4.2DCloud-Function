<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linda's Care Facility - Remote Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f6f9;
      padding: 30px;
      margin: 0;
    }
    h2 {
      color: #222;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 30px;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      width: 200px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .status {
      margin: 15px 0;
      font-weight: bold;
      font-size: 16px;
    }
    .on {
      color: #28a745;
    }
    .off {
      color: #dc3545;
    }
    #msg {
      margin-top: 25px;
      font-weight: 500;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>Linda's Care Facility</h2>
  <p class="subtitle">Remote Lighting Control Interface</p>

  <div class="container">
    <!-- Living Room -->
    <div class="card">
      <h3>Living Room</h3>
      <div id="s_liv" class="status off">Status: OFF</div>
      <button onclick="toggleRoom('living room')">Toggle Light</button>
    </div>

    <!-- Bathroom -->
    <div class="card">
      <h3>Bathroom</h3>
      <div id="s_bat" class="status off">Status: OFF</div>
      <button onclick="toggleRoom('bathroom')">Toggle Light</button>
    </div>

    <!-- Closet -->
    <div class="card">
      <h3>Closet</h3>
      <div id="s_clo" class="status off">Status: OFF</div>
      <button onclick="toggleRoom('closet')">Toggle Light</button>
    </div>
  </div>

  <div id="msg"></div>

  <script>
    // Configured with your exact Arduino IP
    const ARDUINO_IP = "http://10.245.119.148";

    function toggleRoom(roomName) {
      const msgBox = document.getElementById("msg");
      msgBox.style.color = "#555";
      msgBox.innerText = `Sending command for ${roomName}...`;

      const endpoint = `${ARDUINO_IP}/api/toggle?room=${encodeURIComponent(roomName)}`;

      fetch(endpoint, {
        method: "GET",
        mode: "cors"
      })
      .then(response => {
        if (!response.ok) throw new Error("Communication error");
        return response.json();
      })
      .then(data => {
        msgBox.style.color = "#28a745";
        msgBox.innerText = `Command acknowledged! Updated ${roomName}`;

        // Update Living Room UI
        document.getElementById("s_liv").innerText = data.living ? "Status: ON" : "Status: OFF";
        document.getElementById("s_liv").className = `status ${data.living ? "on" : "off"}`;

        // Update Bathroom UI
        document.getElementById("s_bat").innerText = data.bathroom ? "Status: ON" : "Status: OFF";
        document.getElementById("s_bat").className = `status ${data.bathroom ? "on" : "off"}`;

        // Update Closet UI
        document.getElementById("s_clo").innerText = data.closet ? "Status: ON" : "Status: OFF";
        document.getElementById("s_clo").className = `status ${data.closet ? "on" : "off"}`;
      })
      .catch(error => {
        console.error(error);
        msgBox.style.color = "#dc3545";
        msgBox.innerText = "Network Error: Unable to reach Arduino at 10.245.119.148. Ensure you are on the same Wi-Fi network.";
      });
    }
  </script>

</body>
</html>
