<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linda's Smart Home - Light Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="control-card">
    <h2>Carer Light Control</h2>
    <p>Select a room to toggle the LED remotely:</p>

    <div class="button-group">
      <button id="btn-living" class="btn btn-living">Toggle Living Room</button>
      <button id="btn-bath" class="btn btn-bath">Toggle Bathroom</button>
      <button id="btn-closet" class="btn btn-closet">Toggle Closet</button>
    </div>

    <div id="status-box" class="status">System Ready</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
